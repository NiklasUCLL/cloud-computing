services:
  backend:
    container_name: backend
    image: postgres:18
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 100s

  frontend:
    container_name: frontend
    image: storingsmelder
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - 8000:8000
    depends_on:
      backend:
        condition: service_healthy
